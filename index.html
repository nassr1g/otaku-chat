<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1a0e2e">
<title>دردشة أوتاكو ⭐</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="starfield"></div>

  <!-- Name / identity modal -->
  <div class="name-overlay" id="nameOverlay">
    <div class="name-card">
      <div class="emoji-big">🌸</div>
      <h2>أهلاً يا أوتاكو! ⭐</h2>
      <p class="sub">اختر لقبك للانضمام إلى الدردشة العامة</p>
      <input type="text" id="nameInput" placeholder="اكتب لقبك هنا... ✨" maxlength="20" autocomplete="off">
      <button id="joinBtn">انضم للدردشة 🌟</button>
      <div class="err" id="nameErr"></div>
    </div>
  </div>

  <div class="app">
    <!-- Header -->
    <header class="chat-header">
      <div class="chat-title">
        <span class="emoji">⭐</span>
        دردشة أوتاكو
      </div>
      <div class="header-meta">
        <div class="pill" id="connPill">
          <span class="status-dot" id="statusDot"></span>
          <span id="statusText">متصل</span>
        </div>
        <div class="pill">👥 <span id="onlineCount">0</span></div>
      </div>
    </header>

    <!-- Messages -->
    <main class="messages-wrap" id="messagesWrap">
      <div class="load-more-row" id="loadMoreRow" style="display:none;">
        <button class="load-more-btn" id="loadMoreBtn">تحميل رسائل أقدم ⬆️</button>
      </div>
      <div class="welcome-card" id="welcomeCard">
        <div class="big">🌟✨</div>
        <h3>مرحباً بك في الدردشة!</h3>
        <p>مكان للأوتاكو للحديث عن الأنمي 🌸</p>
      </div>
      <div id="messagesList"></div>
    </main>

    <div class="typing-row" id="typingRow">
      <span id="typingNames"></span>
      <span class="typing-dots"><span></span><span></span><span></span></span>
    </div>

    <!-- Reply preview -->
    <div class="reply-preview" id="replyPreview" style="display:none;">
      <div class="bar"></div>
      <div class="body">
        <div class="who" id="replyPreviewWho"></div>
        <div class="txt" id="replyPreviewTxt"></div>
      </div>
      <button class="cancel" id="replyCancelBtn">✕</button>
    </div>

    <!-- Composer -->
    <div class="composer">
      <div class="emoji-panel" id="emojiPanel">
        <div class="emoji-tabs" id="emojiTabs"></div>
        <div class="emoji-grid" id="emojiGrid"></div>
      </div>
      <button class="icon-btn" id="emojiToggleBtn" title="إيموجي" aria-label="إيموجي">😊</button>
      <div class="composer-input-wrap">
        <textarea class="composer-input" id="messageInput" placeholder="شاركنا أفكارك عن الأنمي... 💭" maxlength="1000" rows="1"></textarea>
      </div>
      <button class="send-btn" id="sendBtn" aria-label="إرسال">➤</button>
    </div>
  </div>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

  <script src="emoji-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
