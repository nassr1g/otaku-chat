<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دردشة أوتاكو ⭐</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans Arabic', sans-serif;
            background: linear-gradient(135deg, #1a0e2e 0%, #2d1b47 25%, #4a2c5a 50%, #2d1b47 75%, #1a0e2e 100%);
            background-attachment: fixed;
            min-height: 100vh;
            color: #e8e3ff;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(2px 2px at 20px 30px, #fff, transparent),
                radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
                radial-gradient(2px 2px at 160px 30px, #fff, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: twinkle 4s ease-in-out infinite alternate;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes twinkle {
            0% { opacity: 0.3; }
            100% { opacity: 0.8; }
        }

        .chat-container {
            width: 100%;
            height: 100vh;
            background: rgba(26, 14, 46, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 2;
        }

        .chat-header {
            background: linear-gradient(135deg, #6a4c93 0%, #9b59b6 50%, #8e44ad 100%);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(139, 69, 19, 0.3);
            border-bottom: 2px solid rgba(155, 89, 182, 0.3);
        }

        .chat-title {
            font-size: 20px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .anime-icon {
            font-size: 24px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        .connection-status {
            font-size: 12px;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.1);
            padding: 4px 8px;
            border-radius: 12px;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        .status-dot.disconnected {
            background: #f44336;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .messages-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background: 
                linear-gradient(rgba(26, 14, 46, 0.8), rgba(45, 27, 71, 0.8)),
                url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><defs><pattern id="stars" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="0.5" fill="%23e8e3ff" opacity="0.1"/></pattern></defs><rect width="100" height="100" fill="url(%23stars)"/></svg>');
            scrollbar-width: thin;
            scrollbar-color: rgba(155, 89, 182, 0.5) transparent;
        }

        .messages-container::-webkit-scrollbar {
            width: 6px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: transparent;
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(155, 89, 182, 0.5);
            border-radius: 3px;
        }

        .message {
            margin-bottom: 15px;
            display: flex;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from { 
                opacity: 0; 
                transform: translateY(20px) scale(0.8);
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1);
            }
        }

        .message.sent {
            justify-content: flex-end;
        }

        .message-bubble {
            max-width: 85%;
            padding: 14px 18px;
            border-radius: 20px;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(10px);
        }

        .message.received .message-bubble {
            background: linear-gradient(135deg, rgba(74, 44, 90, 0.9) 0%, rgba(45, 27, 71, 0.9) 100%);
            border: 1px solid rgba(155, 89, 182, 0.3);
            border-bottom-right-radius: 6px;
            color: #e8e3ff;
        }

        .message.sent .message-bubble {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 50%, #6a4c93 100%);
            color: white;
            border-bottom-left-radius: 6px;
        }

        .message-sender {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 5px;
            opacity: 0.9;
            color: #c8a2c8;
        }

        .message-time {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 5px;
            text-align: left;
        }

        .message.sent .message-time {
            text-align: right;
        }

        .input-area {
            padding: 15px 20px;
            background: linear-gradient(135deg, rgba(26, 14, 46, 0.95) 0%, rgba(45, 27, 71, 0.95) 100%);
            display: flex;
            align-items: center;
            gap: 12px;
            border-top: 1px solid rgba(155, 89, 182, 0.2);
            backdrop-filter: blur(15px);
        }

        .message-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid rgba(155, 89, 182, 0.3);
            border-radius: 25px;
            background: rgba(74, 44, 90, 0.3);
            color: #e8e3ff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .message-input::placeholder {
            color: rgba(232, 227, 255, 0.6);
        }

        .message-input:focus {
            border-color: #9b59b6;
            background: rgba(74, 44, 90, 0.5);
            box-shadow: 0 0 20px rgba(155, 89, 182, 0.3);
        }

        .send-button {
            width: 55px;
            height: 55px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            font-size: 22px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
        }

        .send-button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 25px rgba(155, 89, 182, 0.6);
        }

        .send-button:active {
            transform: scale(0.95);
        }

        .send-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: none;
            padding: 12px 18px;
            color: #c8a2c8;
            font-style: italic;
            font-size: 14px;
            background: rgba(74, 44, 90, 0.5);
            border-radius: 15px;
            margin: 0 20px 10px;
            backdrop-filter: blur(10px);
        }

        .name-input {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(26, 14, 46, 0.95) 0%, rgba(45, 27, 71, 0.95) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(15px);
        }

        .name-modal {
            background: linear-gradient(135deg, rgba(74, 44, 90, 0.9) 0%, rgba(45, 27, 71, 0.9) 100%);
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(155, 89, 182, 0.3);
            backdrop-filter: blur(20px);
            max-width: 90%;
            width: 350px;
        }

        .name-modal h2 {
            margin-bottom: 25px;
            color: #e8e3ff;
            font-size: 24px;
            font-weight: 600;
        }

        .name-modal .anime-welcome {
            font-size: 48px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .name-modal input {
            width: 100%;
            padding: 16px 20px;
            border: 2px solid rgba(155, 89, 182, 0.4);
            border-radius: 12px;
            font-size: 16px;
            margin-bottom: 25px;
            outline: none;
            background: rgba(26, 14, 46, 0.7);
            color: #e8e3ff;
            transition: all 0.3s ease;
        }

        .name-modal input::placeholder {
            color: rgba(232, 227, 255, 0.6);
        }

        .name-modal input:focus {
            border-color: #9b59b6;
            box-shadow: 0 0 20px rgba(155, 89, 182, 0.4);
        }

        .name-modal button {
            background: linear-gradient(135deg, #9b59b6 0%, #8e44ad 100%);
            color: white;
            border: none;
            padding: 16px 35px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(155, 89, 182, 0.4);
        }

        .name-modal button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(155, 89, 182, 0.6);
        }

        .user-count {
            background: rgba(155, 89, 182, 0.2);
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            backdrop-filter: blur(5px);
        }

        .welcome-message {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, rgba(74, 44, 90, 0.3) 0%, rgba(45, 27, 71, 0.3) 100%);
            border-radius: 15px;
            margin: 10px 0;
            border: 1px solid rgba(155, 89, 182, 0.2);
            backdrop-filter: blur(10px);
        }

        .system-message {
            text-align: center;
            font-size: 13px;
            color: #c8a2c8;
            background: rgba(74, 44, 90, 0.2);
            padding: 8px 15px;
            border-radius: 12px;
            margin: 10px auto;
            max-width: 80%;
            backdrop-filter: blur(5px);
        }

        .error-message {
            background: rgba(244, 67, 54, 0.2);
            color: #ffcdd2;
            border: 1px solid rgba(244, 67, 54, 0.3);
            padding: 12px 16px;
            border-radius: 12px;
            margin: 10px auto;
            text-align: center;
            max-width: 80%;
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .chat-container {
                border-radius: 0;
            }
            
            .messages-container {
                padding: 15px;
            }
            
            .message-bubble {
                max-width: 90%;
                padding: 12px 16px;
            }
            
            .input-area {
                padding: 12px 15px;
            }
            
            .message-input {
                font-size: 16px;
                padding: 12px 16px;
            }
            
            .send-button {
                width: 50px;
                height: 50px;
                font-size: 18px;
            }
        }

        .sakura {
            position: fixed;
            top: -10px;
            animation: fall 10s linear infinite;
            pointer-events: none;
            z-index: 1;
        }

        @keyframes fall {
            0% {
                transform: translateY(-100vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        .room-id-display {
            background: rgba(155, 89, 182, 0.1);
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 12px;
            margin-bottom: 10px;
            border: 1px solid rgba(155, 89, 182, 0.2);
            text-align: center;
        }

        .room-id-display strong {
            color: #9b59b6;
        }
    </style>
</head>
<body>
    <div class="name-input" id="nameInput">
        <div class="name-modal">
            <div class="anime-welcome">🌸</div>
            <h2>أهلاً يا أوتاكو! ⭐</h2>
            <p style="margin-bottom: 20px; color: #c8a2c8;">ما لقبك في عالم الأنمي؟</p>
            <input type="text" id="userName" placeholder="اكتب لقبك هنا... ✨" maxlength="20">
            <input type="text" id="roomId" placeholder="رقم الغرفة (اختياري)" maxlength="10" style="margin-bottom: 15px;">
            <p style="font-size: 12px; color: #c8a2c8; margin-bottom: 20px;">
                اتركه فارغاً للانضمام للغرفة العامة
            </p>
            <button onclick="setUserName()">انضم للدردشة 🌟</button>
        </div>
    </div>

    <div class="chat-container">
        <div class="chat-header">
            <div class="chat-title">
                <span class="anime-icon">⭐</span>
                دردشة أوتاكو
                <span class="anime-icon">🌸</span>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <div class="connection-status" id="connectionStatus">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">متصل</span>
                </div>
                <div class="user-count">
                    👥 <span id="onlineCount">0</span> أوتاكو
                </div>
            </div>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="room-id-display" id="roomDisplay" style="display: none;">
                أنت في الغرفة: <strong id="currentRoom"></strong>
            </div>
            <div class="welcome-message">
                <div style="font-size: 32px; margin-bottom: 10px;">🌟✨</div>
                <h3>مرحباً بك في الدردشة!</h3>
                <p style="margin-top: 10px; color: #c8a2c8;">مكان للأوتاكو للحديث عن الأنمي 🌸</p>
            </div>
        </div>

        <div class="typing-indicator" id="typingIndicator">
            شخص ما يكتب... ✍️
        </div>

        <div class="input-area">
            <input type="text" class="message-input" id="messageInput" placeholder="شاركنا أفكارك عن الأنمي... 💭" maxlength="500">
            <button class="send-button" id="sendButton" onclick="sendMessage()">
                ➤
            </button>
        </div>
    </div>

    <!-- Firebase SDK -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-app-compat.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/9.22.0/firebase-database-compat.min.js"></script>

    <script>
        // إعدادات Firebase (يجب تعديلها حسب مشروعك)
        const firebaseConfig = {
            apiKey: "AIzaSyDTVX_LM8wtrgAGgCzFAOVb5AV5d_ieI9k",
            authDomain: "otaku2-e2764.firebaseapp.com",
            databaseURL: "https://otaku2-e2764-default-rtdb.firebaseio.com",
            projectId: "otaku2-e2764",
            storageBucket: "otaku2-e2764.firebasestorage.app",
            messagingSenderId: "1006295063792",
            appId: "1:1006295063792:web:c848a9714ee3ada87af635",
            measurementId: "G-1MR57ZC92C"
        };

        let app, database, messagesRef, usersRef;
        let currentUser = '';
        let currentRoom = 'public';
        let isConnected = false;
        let typingTimeout;
        let firebaseInitialized = false;

        // محاولة تهيئة Firebase
        try {
            app = firebase.initializeApp(firebaseConfig);
            database = firebase.database();
            firebaseInitialized = true;
        } catch (error) {
            console.error("خطأ في تهيئة Firebase:", error);
            firebaseInitialized = false;
        }

        function setUserName() {
            const nameInput = document.getElementById('userName');
            const roomInput = document.getElementById('roomId');
            const name = nameInput.value.trim();
            const room = roomInput.value.trim() || 'public';
            
            if (name.length < 2) {
                alert('يرجى إدخال لقب صحيح (حرفين على الأقل) 🙏');
                return;
            }
            
            currentUser = name;
            currentRoom = room;
            
            document.getElementById('nameInput').style.display = 'none';
            
            if (room !== 'public') {
                document.getElementById('roomDisplay').style.display = 'block';
                document.getElementById('currentRoom').textContent = room;
            }
            
            if (firebaseInitialized) {
                initializeChat();
            } else {
                showError("لا يمكن الاتصال بقاعدة البيانات. يرجى التحقق من إعدادات Firebase.");
            }
            
            createSakura();
        }

        function initializeChat() {
            if (!database) {
                showError("لا يمكن الاتصال بقاعدة البيانات. يرجى التحقق من إعدادات Firebase.");
                return;
            }

            messagesRef = database.ref(`rooms/${currentRoom}/messages`);
            usersRef = database.ref(`rooms/${currentRoom}/users`);

            // مراقبة الاتصال
            const connectedRef = database.ref('.info/connected');
            connectedRef.on('value', (snapshot) => {
                isConnected = snapshot.val();
                updateConnectionStatus();
                
                if (isConnected) {
                    // إضافة المستخدم للقائمة
                    const userRef = usersRef.child(currentUser);
                    userRef.set({
                        name: currentUser,
                        lastSeen: firebase.database.ServerValue.TIMESTAMP,
                        isOnline: true
                    });
                    
                    // إزالة المستخدم عند قطع الاتصال
                    userRef.onDisconnect().remove();
                }
            });

            // مراقبة الرسائل الجديدة
            messagesRef.limitToLast(50).on('child_added', (snapshot) => {
                const message = snapshot.val();
                if (message && message.sender !== currentUser) {
                    displayMessage(message, false);
                }
            });

            // مراقبة المستخدمين المتصلين
            usersRef.on('value', (snapshot) => {
                const users = snapshot.val() || {};
                const onlineCount = Object.keys(users).length;
                document.getElementById('onlineCount').textContent = onlineCount;
            });

            // رسالة الانضمام
            addSystemMessage(`انضم ${currentUser} إلى الدردشة! 🌟`);
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text || !currentUser) {
                return;
            }

            if (!firebaseInitialized || !isConnected) {
                showError("لا يمكن إرسال الرسالة. تحقق من الاتصال بالإنترنت.");
                return;
            }

            const message = {
                sender: currentUser,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                time: new Date().toLocaleTimeString('ar-SA', { 
                    hour: '2-digit', 
                    minute: '2-digit',
                    hour12: true 
                })
            };

            // إرسال الرسالة لـ Firebase
            messagesRef.push(message).then(() => {
                // عرض الرسالة محلياً
                displayMessage(message, true);
                input.value = '';
                
                // تأثير الإرسال
                navigator.vibrate && navigator.vibrate(50);
            }).catch((error) => {
                showError("فشل في إرسال الرسالة");
                console.error("خطأ في الإرسال:", error);
            });
        }

        function displayMessage(message, isSent) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isSent ? 'sent' : 'received'}`;
            
            let senderName = !isSent ? 
                `<div class="message-sender">${message.sender}</div>` : '';
            
            messageDiv.innerHTML = `
                <div class="message-bubble">
                    ${senderName}
                    ${message.text}
                    <div class="message-time">${message.time}</div>
                </div>
            `;
            
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function addSystemMessage(text) {
            const container = document.getElementById('messagesContainer');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'system-message';
            messageDiv.innerHTML = text;
            container.appendChild(messageDiv);
            scrollToBottom();
        }

        function showError(text) {
            const container = document.getElementById('messagesContainer');
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = text;
            container.appendChild(errorDiv);
            scrollToBottom();
        }

        function updateConnectionStatus() {
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');
            const sendButton = document.getElementById('sendButton');
            
            if (isConnected && firebaseInitialized) {
                statusDot.classList.remove('disconnected');
                statusText.textContent = 'متصل';
                sendButton.disabled = false;
            } else {
                statusDot.classList.add('disconnected');
                statusText.textContent = 'منقطع';
                sendButton.disabled = true;
            }
        }

        function scrollToBottom() {
            const container = document.getElementById('messagesContainer');
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }

        function createSakura() {
            setInterval(() => {
                if (Math.random() < 0.3) {
                    const sakura = document.createElement('div');
                    sakura.innerHTML = ['🌸', '🌺', '⭐', '✨'][Math.floor(Math.random() * 4)];
                    sakura.className = 'sakura';
                    sakura.style.left = Math.random() * 100 + '%';
                    sakura.style.animationDuration = (Math.random() * 3 + 7) + 's';
                    sakura.style.fontSize = (Math.random() * 10 + 15) + 'px';
                    document.body.appendChild(sakura);
                    
                    setTimeout(() => {
                        sakura.remove();
                    }, 10000);
                }
            }, 2000);
        }

        // أحداث لوحة المفاتيح
        document.getElementById('messageInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        document.getElementById('userName').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                setUserName();
            }
        });

        document.getElementById('roomId').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                setUserName();
            }
        });

        // منع التكبير عند التركيز على الإدخال
        document.addEventListener('touchstart', function() {}, {passive: true});

        // تحديث حالة الاتصال عند تحميل الصفحة
        updateConnectionStatus();
    </script>
</body>
</html>
